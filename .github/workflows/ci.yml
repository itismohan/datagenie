name: DataGenie CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdd-traceability:
    name: SDD traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDD validation dependencies
        run: pip install -r tools/requirements.txt
      - name: Validate specification baseline and traceability
        run: python tools/validate_sdd.py

  catalog-test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datagenie
          POSTGRES_USER: datagenie
          POSTGRES_PASSWORD: datagenie_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datagenie -d datagenie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/catalog-api
    env:
      DATAGENIE_ENVIRONMENT: development
      DATAGENIE_DATABASE_URL: postgresql+psycopg://datagenie:datagenie_ci_password@localhost:5432/datagenie
      DATAGENIE_AUTH_ENABLED: "true"
      DATAGENIE_AUTH_JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/catalog-api/requirements.txt
      - name: Install catalog dependencies
        run: pip install -r requirements.txt
      - name: Validate migration chain
        run: alembic upgrade head && alembic current
      - name: Run catalog tests
        run: pytest -q
      - name: Verify committed OpenAPI contract
        run: |
          python scripts/export_openapi.py
          git -C ../.. diff --exit-code -- docs/openapi/catalog-api-v1.json

  service-unit-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [quality-api, lineage-api, search-api]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt
      - name: Install service dependencies
        run: pip install -r requirements.txt
      - name: Run service tests
        run: pytest -q

  dependency-security-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - apps/catalog-api/requirements.txt
          - apps/connector-api/requirements.txt
          - apps/quality-api/requirements.txt
          - apps/lineage-api/requirements.txt
          - apps/search-api/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency scanner
        run: pip install pip-audit
      - name: Scan declared dependencies
        run: pip-audit -r ${{ matrix.requirements }}

  compose-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create non-production Compose environment
        run: cp .env.example .env
      - name: Validate base Compose configuration
        run: docker compose --env-file .env -f infra/docker-compose.yml config -q
      - name: Validate staging Compose configuration
        run: |
          cat >> .env <<'EOF'
          DATAGENIE_ERROR_TRACKING_DSN=https://public@example.invalid/1
          DATAGENIE_AUTH_OIDC_ISSUER=https://auth.example.invalid
          DATAGENIE_AUTH_OIDC_AUDIENCE=datagenie-mcp
          DATAGENIE_AUTH_OIDC_JWKS_URL=https://auth.example.invalid/.well-known/jwks.json
          DATAGENIE_LEDGER_DATABASE_URL=postgresql+psycopg://datagenie:datagenie_ci_password@postgres:5432/datagenie
          EOF
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.staging.yml config -q
      - name: Validate Prometheus configuration and alert rules
        run: docker run --rm -v "$PWD/infra:/etc/prometheus:ro" prom/prometheus:v2.54.1 promtool check config /etc/prometheus/prometheus.yml
      - name: Validate scripts
        run: bash -n infra/scripts/backup-postgres.sh infra/scripts/verify-postgres-restore.sh
