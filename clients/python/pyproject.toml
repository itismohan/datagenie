[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagenie-mcp-helper"
version = "0.1.0"
description = "Constrained standard JSON-RPC helper for DataGenie MCP enterprise hosts"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "DataGenie"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]

[tool.setuptools]
py-modules = ["datagenie_mcp"]
