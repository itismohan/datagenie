services:
  catalog-migrate:
    environment:
      DATAGENIE_ENVIRONMENT: staging
      DATAGENIE_CONNECTOR_REDIS_URL: ${DATAGENIE_CONNECTOR_REDIS_URL:?Set DATAGENIE_CONNECTOR_REDIS_URL in .env}
      DATAGENIE_ERROR_TRACKING_DSN: ${DATAGENIE_ERROR_TRACKING_DSN:?Set DATAGENIE_ERROR_TRACKING_DSN in .env}

  catalog-api:
    environment:
      DATAGENIE_ENVIRONMENT: staging
      DATAGENIE_CONNECTOR_REDIS_URL: ${DATAGENIE_CONNECTOR_REDIS_URL:?Set DATAGENIE_CONNECTOR_REDIS_URL in .env}
      DATAGENIE_ERROR_TRACKING_DSN: ${DATAGENIE_ERROR_TRACKING_DSN:?Set DATAGENIE_ERROR_TRACKING_DSN in .env}

  catalog-worker:
    environment:
      DATAGENIE_ENVIRONMENT: staging
      DATAGENIE_CONNECTOR_REDIS_URL: ${DATAGENIE_CONNECTOR_REDIS_URL:?Set DATAGENIE_CONNECTOR_REDIS_URL in .env}
      DATAGENIE_ERROR_TRACKING_DSN: ${DATAGENIE_ERROR_TRACKING_DSN:?Set DATAGENIE_ERROR_TRACKING_DSN in .env}

  mcp-gateway:
    environment:
      DATAGENIE_ENVIRONMENT: staging
      DATAGENIE_MCP_INTERNAL_BETA_ENABLED: "true"
      DATAGENIE_MCP_KILL_SWITCH_ENABLED: ${DATAGENIE_MCP_KILL_SWITCH_ENABLED:-false}
      DATAGENIE_MCP_ALLOWED_TENANTS: ${DATAGENIE_MCP_ALLOWED_TENANTS:?Set one approved internal MCP tenant in the protected canary environment}
      DATAGENIE_MCP_ALLOWED_HOSTS: ${DATAGENIE_MCP_ALLOWED_HOSTS:?Set one approved internal MCP host in the protected canary environment}
      DATAGENIE_MCP_ALLOWED_ORIGINS: ${DATAGENIE_MCP_ALLOWED_ORIGINS:-}
      DATAGENIE_MCP_RESOURCE_BASE_URL: ${DATAGENIE_MCP_RESOURCE_BASE_URL:?Set the approved internal MCP resource URL}
      DATAGENIE_MCP_AUTHORIZATION_SERVERS: ${DATAGENIE_MCP_AUTHORIZATION_SERVERS:?Set the approved authorization server URL}
      DATAGENIE_AUTH_MODE: oidc
      DATAGENIE_AUTH_OIDC_ISSUER: ${DATAGENIE_AUTH_OIDC_ISSUER:?Set the MCP OIDC issuer}
      DATAGENIE_AUTH_OIDC_AUDIENCE: ${DATAGENIE_AUTH_OIDC_AUDIENCE:?Set the MCP OIDC audience}
      DATAGENIE_AUTH_OIDC_JWKS_URL: ${DATAGENIE_AUTH_OIDC_JWKS_URL:?Set the MCP OIDC JWKS URL}
      DATAGENIE_DOWNSTREAM_SERVICE_SHARED_SECRET: ${DATAGENIE_MCP_GATEWAY_SERVICE_SHARED_SECRET:?Inject the MCP service identity secret}
      DATAGENIE_LEDGER_DATABASE_URL: ${DATAGENIE_LEDGER_DATABASE_URL:?Set the staging MCP ledger PostgreSQL URL}
