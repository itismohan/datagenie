global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: datagenie-catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api:8000"]
  - job_name: datagenie-mcp-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-gateway:8000"]
