change_id: "0001-mcp-read-only-governed-discovery"
title: "MCP read-only governed discovery pilot"
status: "implementing"
owners:
  product: "Product owner (TBD)"
  technical: "Solution architect (TBD)"
  security: "Security owner (TBD)"
  operations: "SRE/on-call owner (TBD)"
requirements:
  - id: "DG-MCP-READ-001"
    statement: "The gateway SHALL bind every MCP operation to a validated tenant-scoped identity and required audience/scope."
    implementation:
      - "apps/mcp-gateway/app/security/identity.py"
      - "apps/mcp-gateway/app/core/tenant_context.py"
      - "apps/mcp-gateway/app/server.py"
    tests:
      - "apps/mcp-gateway/tests/test_transport.py::test_adversarial_identity_and_input_attempts_do_not_leak_results"
      - "apps/mcp-gateway/tests/test_transport.py::test_rejects_unapproved_host_origin_and_protocol"
    contracts:
      - "contracts.md#authentication-and-authorization"
    observability:
      - "datagenie_mcp_tenant_boundary_violations_total"
    evidence:
      - "evidence.md#test-evidence"
  - id: "DG-MCP-READ-002"
    statement: "The gateway SHALL provide bounded tenant-visible governed asset discovery with policy and provenance evidence."
    implementation:
      - "apps/mcp-gateway/app/services/tool_execution.py"
      - "apps/mcp-gateway/app/clients/datagenie.py"
      - "apps/catalog-api/app/api/v1/mcp_internal.py"
    tests:
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_all_remaining_read_tools_return_structured_evidence_packets"
    contracts:
      - "contracts.md#tools"
    observability:
      - "datagenie_mcp_tool_calls_total"
      - "datagenie_mcp_result_bytes"
    evidence:
      - "evidence.md#test-evidence"
  - id: "DG-MCP-READ-003"
    statement: "The gateway SHALL expose governed asset context without raw data, credentials, or unauthorized classified metadata."
    implementation:
      - "apps/mcp-gateway/app/services/tool_execution.py"
      - "apps/catalog-api/app/api/v1/mcp_internal.py"
    tests:
      - "apps/mcp-gateway/tests/test_tool_execution.py::test_asset_context_is_structured_policy_bound_redacted_and_ledgered"
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_tool_call_returns_structured_evidence_policy_obligations_and_redactions"
    contracts:
      - "contracts.md#common-response-and-errors"
    observability:
      - "datagenie_mcp_result_bytes"
    evidence:
      - "evidence.md#test-evidence"
  - id: "DG-MCP-READ-004"
    statement: "The gateway SHALL return explainable quality evidence that distinguishes missing, stale, failed, and low-quality results."
    implementation:
      - "apps/mcp-gateway/app/clients/datagenie.py"
      - "apps/quality-api/app/api/v1/quality.py"
      - "apps/quality-api/app/core/mcp_security.py"
    tests:
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_all_remaining_read_tools_return_structured_evidence_packets"
      - "apps/quality-api/tests/test_quality_api.py"
    contracts:
      - "contracts.md#tools"
    observability:
      - "datagenie_mcp_tool_calls_total"
      - "datagenie_mcp_errors_total"
    evidence:
      - "evidence.md#test-evidence"
  - id: "DG-MCP-READ-005"
    statement: "The gateway SHALL provide bounded tenant-scoped lineage impact with provenance, confidence, and durable fallback handling."
    implementation:
      - "apps/mcp-gateway/app/clients/datagenie.py"
      - "apps/lineage-api/app/api/v1/lineage.py"
      - "apps/lineage-api/app/core/mcp_security.py"
    tests:
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_all_remaining_read_tools_return_structured_evidence_packets"
    contracts:
      - "contracts.md#tools"
    observability:
      - "datagenie_mcp_tool_duration_seconds"
      - "datagenie_mcp_result_bytes"
    evidence:
      - "evidence.md#test-evidence"
      - "evidence.md#operational-evidence"
  - id: "DG-MCP-READ-006"
    statement: "The gateway SHALL bind shared tenant-aware policy evidence and obligations to every governed asset tool result."
    implementation:
      - "apps/mcp-gateway/app/clients/datagenie.py"
      - "apps/mcp-gateway/app/services/tool_execution.py"
      - "apps/catalog-api/app/api/v1/policy.py"
      - "apps/catalog-api/app/core/policy.py"
    tests:
      - "apps/mcp-gateway/tests/test_tool_execution.py::test_denied_policy_fails_closed_before_asset_retrieval_and_records_ledger"
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_tool_call_returns_structured_evidence_policy_obligations_and_redactions"
    contracts:
      - "contracts.md#common-response-and-errors"
    observability:
      - "datagenie_mcp_policy_decisions_total"
    evidence:
      - "evidence.md#test-evidence"
      - "evidence.md#approval-record"
  - id: "DG-MCP-READ-007"
    statement: "The gateway SHALL emit a minimized tenant-scoped agent execution record with policy and evidence correlation for every invocation."
    implementation:
      - "apps/mcp-gateway/app/services/execution_ledger.py"
      - "apps/mcp-gateway/app/server.py"
      - "apps/mcp-gateway/app/services/tool_execution.py"
    tests:
      - "apps/mcp-gateway/tests/test_tool_execution.py::test_asset_context_is_structured_policy_bound_redacted_and_ledgered"
    contracts:
      - "contracts.md#agent-execution-ledger"
    observability:
      - "datagenie_mcp_execution_ledger_write_failures_total"
    evidence:
      - "evidence.md#operational-evidence"
  - id: "DG-MCP-READ-008"
    statement: "Every MCP tool SHALL enforce documented schemas, authorization, limits, timeout, error, cancellation and recovery behavior."
    implementation:
      - "apps/mcp-gateway/app/core/rate_limit.py"
      - "apps/mcp-gateway/app/services/tool_execution.py"
      - "apps/mcp-gateway/app/server.py"
    tests:
      - "apps/mcp-gateway/tests/test_transport.py::test_rejects_unapproved_host_origin_and_protocol"
      - "apps/mcp-gateway/tests/test_jsonrpc_tools.py::test_global_kill_switch_disables_mcp_before_auth_or_dispatch"
    contracts:
      - "contracts.md#operational-constraints"
    observability:
      - "datagenie_mcp_tool_duration_seconds"
      - "datagenie_mcp_rate_limit_denials_total"
      - "datagenie_mcp_errors_total"
    evidence:
      - "evidence.md#operational-evidence"
  - id: "DG-MCP-READ-009"
    statement: "The initial MCP surface SHALL remain read-only and exclude mutation, export, secret, arbitrary SQL, and arbitrary HTTP capabilities."
    implementation:
      - "apps/mcp-gateway/app/server.py"
      - "apps/mcp-gateway/app/services/tool_execution.py"
    tests:
      - "apps/mcp-gateway/tests/test_transport.py::test_metadata_capability_negotiation_and_four_tool_surface"
      - "apps/mcp-gateway/tests/test_transport.py::test_adversarial_identity_and_input_attempts_do_not_leak_results"
    contracts:
      - "contracts.md#tools"
    observability:
      - "datagenie_mcp_tool_calls_total"
      - "datagenie_mcp_errors_total"
    evidence:
      - "evidence.md#test-evidence"
      - "evidence.md#approval-record"
